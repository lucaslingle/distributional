[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributional"
version = "0.1.0"
description = "A library for histogram arithmetic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy~=2.4.6",
    "matplotlib~=3.11.0",
]

[project.optional-dependencies]
test = [
    "pytest~=9.0.3",
    "coverage~=7.14.1",
]
docs = [
    "mkdocs~=1.6.1",
    "mkdocstrings~=1.0.6",
    "mkdocstrings-python~=2.0.5",
    "seaborn~=0.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]
